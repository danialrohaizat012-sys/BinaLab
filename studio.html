<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071425">
<title>BinaLab Studio</title>
<style>
:root{--navy:#071425;--navy2:#0D2743;--green:#22C55E;--blue:#2563EB;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--soft:#F6F8FB;--white:#fff;--danger:#DC2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#F5F7FA;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:850}.primary{background:linear-gradient(135deg,var(--green),#14B8A6);color:#fff}.dark{background:var(--navy);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#FFF1F2;color:#BE123C;border:1px solid #FECDD3}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#071425,#0D2743)}.login-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:30px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:21px}.brand img{width:44px;border-radius:14px}.brand b{color:var(--green)}
.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:850;color:#475569}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fff}.field textarea{min-height:110px;resize:vertical}
.app{display:none}.top{position:sticky;top:0;z-index:40;background:rgba(245,247,250,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top-inner{max-width:1440px;margin:auto;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.shell{max-width:1440px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.stat strong{font-size:30px;display:block}.stat small{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:11px 14px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:850}.tab.active{background:var(--navy);color:#fff}.view{display:none}.view.active{display:block}
.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:23px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.lead-list,.content-list{max-height:720px;overflow:auto}.lead,.content-item{padding:14px 17px;border-bottom:1px solid var(--line);cursor:pointer}.lead:hover,.lead.active,.content-item:hover,.content-item.active{background:#F0FDF4}.lead h3,.content-item h3{font-size:15px;margin:0 0 4px}.lead p,.content-item p{font-size:11px;color:var(--muted);margin:0}
.detail{padding:22px}.project-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.project-head h1{margin:6px 0;font-size:34px}.case{font-size:11px;font-weight:950;letter-spacing:.08em;color:var(--green)}.logo{width:78px;height:78px;border-radius:18px;object-fit:cover;background:var(--soft)}
.project-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.project-tab{padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;font-weight:800;font-size:12px}.project-tab.active{background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8}.project-pane{display:none}.project-pane.active{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.info{padding:14px;border-radius:15px;background:var(--soft)}.info small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.stage-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:15px 0}.stage{padding:12px 8px;border-radius:13px;background:#F1F5F9;text-align:center;font-size:10px;font-weight:850;color:#64748B}.stage.done{background:#DCFCE7;color:#166534}.stage.current{background:#DBEAFE;color:#1D4ED8}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.message{display:none;margin-top:12px;padding:12px;border-radius:13px}.message.show{display:block}.success{background:#F0FDF4;color:#166534}.error{background:#FFF1F2;color:#BE123C}
.timeline{display:grid;gap:11px}.timeline-item{display:grid;grid-template-columns:32px 1fr;gap:10px}.timeline-dot{width:30px;height:30px;border-radius:10px;background:#EFF6FF;color:#1D4ED8;display:grid;place-items:center;font-size:11px;font-weight:900}.timeline-item h4{margin:2px 0 4px}.timeline-item p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.task-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.task-row input[type="text"]{border:0;background:transparent;padding:6px;width:100%}.task-row small{color:var(--muted)}
.content-layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.form-card{padding:22px}.toggle{display:flex;align-items:center;gap:8px;margin-top:12px}.thumb{width:84px;height:84px;border-radius:16px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:80px 20px}
@media(max-width:950px){.stats{grid-template-columns:1fr 1fr}.layout,.content-layout{grid-template-columns:1fr}.lead-list,.content-list{max-height:360px}.stage-strip{grid-template-columns:repeat(4,1fr)}}@media(max-width:620px){.shell{padding:13px}.grid2{grid-template-columns:1fr}.full{grid-column:auto}.project-head{flex-direction:column}.stage-strip{grid-template-columns:repeat(2,1fr)}}

.quick-update{background:linear-gradient(145deg,#071425,#0D2743);color:#fff;border-radius:20px;padding:18px;margin:18px 0}
.quick-update h3{margin:0 0 6px}.quick-update p{margin:0 0 14px;color:#AFC0D0;font-size:12px;line-height:1.5}
.quick-grid{display:grid;grid-template-columns:1fr 120px;gap:10px}
.quick-grid textarea,.quick-grid input,.quick-grid select{width:100%;padding:12px 13px;border:0;border-radius:12px}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.smart-card{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}
.smart-card strong{display:block;margin-bottom:5px}.smart-card small{color:var(--muted);line-height:1.5}
.collapsible{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.collapsible summary{cursor:pointer;font-weight:850;color:#334155}
.subtle{font-size:11px;color:var(--muted)}
@media(max-width:700px){.quick-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<section class="login" id="loginView"><div class="login-card">
<div class="brand"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b> Studio</span></div><h1>Owner Login</h1><p style="color:var(--muted)">Internal command centre for BinaLab.</p>
<div class="field"><label>Email</label><input id="loginEmail" type="email"></div><div class="field" style="margin-top:12px"><label>Password</label><input id="loginPassword" type="password"></div>
<button class="btn primary" id="loginBtn" style="width:100%;margin-top:16px">Login to Studio</button><div class="message error" id="loginError"></div>
</div></section>

<div class="app" id="appView">
<header class="top"><div class="top-inner"><div class="brand"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b> Studio</span></div><button class="btn ghost" id="logoutBtn">Logout</button></div></header>
<main class="shell">
<div class="stats"><div class="stat"><strong id="statTotal">0</strong><small>Total Discoveries</small></div><div class="stat"><strong id="statNew">0</strong><small>New Leads</small></div><div class="stat"><strong id="statPrototype">0</strong><small>Prototype Stage</small></div><div class="stat"><strong id="statActive">0</strong><small>Active Projects</small></div></div>
<div class="tabs"><button class="tab active" data-view="projectsView">Projects</button><button class="tab" data-view="systemsView">Website Systems</button><button class="tab" data-view="testimonialsView">Testimonials</button></div>

<section class="view active" id="projectsView"><div class="layout">
<section class="panel"><div class="panel-head"><strong>Projects & Discoveries</strong></div><div class="lead-list" id="leadList"></div></section>
<section class="panel"><div class="detail" id="detailView"><div class="empty">Select a project to manage it.</div></div></section>
</div></section>

<section class="view" id="systemsView"><div class="content-layout">
<section class="panel"><div class="panel-head"><strong>Website Systems</strong><div><button class="btn ghost" id="seedSystems">Import Current 4</button><button class="btn primary" id="newSystem">+ New</button></div></div><div class="content-list" id="systemList"></div></section>
<section class="panel"><div class="form-card" id="systemEditor"><div class="empty">Add or select a system.</div></div></section>
</div></section>

<section class="view" id="testimonialsView"><div class="content-layout">
<section class="panel"><div class="panel-head"><strong>Testimonials</strong><button class="btn primary" id="newTestimonial">+ New</button></div><div class="content-list" id="testimonialList"></div></section>
<section class="panel"><div class="form-card" id="testimonialEditor"><div class="empty">Add or select a testimonial.</div></div></section>
</div></section>
</main></div>

<script type="module">
import {db,auth,collection,query,orderBy,onSnapshot,doc,updateDoc,deleteDoc,setDoc,addDoc,serverTimestamp,arrayUnion,signInWithEmailAndPassword,signOut,onAuthStateChanged} from './firebase-config.js?v=420';

const stages=['Discovery','Problem Mapping','Blueprint','Prototype','Proposal','Development','Testing','Launch'];
let discoveries=[],selectedId=null,websiteSystems=[],websiteTestimonials=[],selectedSystemId=null,selectedTestimonialId=null,systemImageData=null,testimonialAvatarData=null;

const loginView=document.getElementById('loginView'),appView=document.getElementById('appView');
onAuthStateChanged(auth,user=>{loginView.style.display=user?'none':'grid';appView.style.display=user?'block':'none';if(user){listenProjects();listenContent()}});
loginBtn.onclick=async()=>{try{await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value)}catch(e){loginError.textContent=e.message;loginError.className='message error show'}};
logoutBtn.onclick=()=>signOut(auth);

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active')});

function listenProjects(){onSnapshot(query(collection(db,'businessDiscoveries'),orderBy('createdAt','desc')),snap=>{discoveries=snap.docs.map(x=>({id:x.id,...x.data()}));renderStats();renderList();if(selectedId)renderProject(discoveries.find(x=>x.id===selectedId))})}
function renderStats(){statTotal.textContent=discoveries.length;statNew.textContent=discoveries.filter(x=>x.status==='new').length;statPrototype.textContent=discoveries.filter(x=>x.stage==='Prototype').length;statActive.textContent=discoveries.filter(x=>!['completed','rejected'].includes(x.status)).length}
function renderList(){leadList.innerHTML=discoveries.map(d=>`<div class="lead ${d.id===selectedId?'active':''}" data-id="${d.id}"><h3>${esc(d.businessName||'Untitled')}</h3><p>${esc(d.caseId||'')} • ${esc(d.stage||'Discovery')} • ${Number(d.progress||10)}%</p></div>`).join('')||'<div class="empty">No discoveries yet.</div>';leadList.querySelectorAll('.lead').forEach(el=>el.onclick=()=>{selectedId=el.dataset.id;renderList();renderProject(discoveries.find(x=>x.id===selectedId))})}

function renderProject(d){
 if(!d){detailView.innerHTML='<div class="empty">Select a project.</div>';return}
 const portal=new URL('portal.html',location.href);portal.searchParams.set('id',d.id);
 const current=Math.max(0,stages.indexOf(d.stage||'Discovery'));
 const tasks=d.tasks||[];
 detailView.innerHTML=`
 <div class="project-head"><div><span class="case">${esc(d.caseId||'DISCOVERY')}</span><h1>${esc(d.businessName||'Untitled')}</h1><p style="color:var(--muted)">${esc(d.industry||'')} • ${esc(d.ownerName||'')} • ${esc(d.phone||'')}</p></div>${d.logoData?`<img class="logo" src="${d.logoData}">`:''}</div>
 <div class="stage-strip">${stages.map((s,i)=>`<div class="stage ${i<current?'done':i===current?'current':''}">${s}</div>`).join('')}</div>
 <div class="quick-update">
   <h3>Quick Update</h3>
   <p>Update client progress in under 30 seconds.</p>
   <div class="quick-grid">
     <textarea id="quickMessage" placeholder="Contoh: Prototype flow dah siap. Sekarang kami kemaskan UI sebelum share dengan anda.">${esc(d.customerMessage||'')}</textarea>
     <div>
       <select id="quickStage">${stages.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select>
       <input id="quickProgress" type="number" min="0" max="100" value="${Number(d.progress||10)}" style="margin-top:8px" placeholder="%">
     </div>
   </div>
   <div class="quick-actions">
     <button class="btn primary" id="quickSave">Save Update</button>
     <button class="btn dark" id="quickNotify">Save + WhatsApp Client</button>
     <a class="btn ghost" href="${portal.href}" target="_blank" style="color:#0F172A">Open Client Portal</a>
   </div>
   <div class="message" id="quickMessageBox"></div>
 </div>

 <div class="grid2">
   <div class="smart-card"><strong>Current Stage</strong><small>${esc(d.stage||'Discovery')} • ${Number(d.progress||10)}%</small></div>
   <div class="smart-card"><strong>Client</strong><small>${esc([d.ownerName,d.phone].filter(Boolean).join(' • ')||'—')}</small></div>
   <div class="smart-card full"><strong>Problem to Solve</strong><small>${esc(d.biggestProblem||'—')}</small></div>
   <div class="smart-card full"><strong>Desired Outcome</strong><small>${esc(d.dreamOutcome||'—')}</small></div>
 </div>

 <details class="collapsible">
   <summary>Project Assets</summary>
   <div class="grid2" style="margin-top:14px">
     <div class="field full"><label>Prototype URL</label><input id="prototypeUrl" value="${esc(d.prototypeUrl||'')}" placeholder="https://..."></div>
     <div class="field full"><label>Quotation / Proposal URL</label><input id="quotationUrl" value="${esc(d.quotationUrl||'')}" placeholder="https://..."></div>
     <div class="field full"><label>Business Blueprint URL</label><input id="blueprintUrl" value="${esc(d.blueprintUrl||'')}" placeholder="https://..."></div>
     <div class="field full"><label>Live System URL</label><input id="liveSystemUrl" value="${esc(d.liveSystemUrl||'')}" placeholder="https://..."></div>
   </div>
   <div class="actions"><button class="btn primary" id="saveAssets">Save Assets</button></div><div class="message" id="assetMessage"></div>
 </details>

 <details class="collapsible">
   <summary>Internal Tasks</summary>
   <div id="taskList" style="margin-top:12px">${tasks.map((t,i)=>`<div class="task-row"><input type="checkbox" data-task-check="${i}" ${t.done?'checked':''}><input type="text" data-task-text="${i}" value="${esc(t.text||'')}"><small>${esc(t.owner||'')}</small></div>`).join('')||'<p class="subtle">No tasks yet.</p>'}</div>
   <div class="grid2" style="margin-top:12px"><div class="field"><label>New Task</label><input id="newTaskText" placeholder="Prepare prototype"></div><div class="field"><label>Owner</label><input id="newTaskOwner" placeholder="Danial"></div></div>
   <div class="actions"><button class="btn primary" id="saveTasks">Save Tasks</button></div>
 </details>

 <details class="collapsible">
   <summary>Project Timeline</summary>
   <div class="timeline" style="margin-top:12px">${(d.timeline||[]).slice().reverse().map((t,i)=>`<div class="timeline-item"><div class="timeline-dot">${i+1}</div><div><h4>${esc(t.title||t.stage||'Update')}</h4><p>${esc(t.message||'')}</p><small style="color:var(--muted)">${esc(t.at||'')}</small></div></div>`).join('')||'<p class="subtle">No updates yet.</p>'}</div>
 </details>`;

 quickSave.onclick=()=>quickUpdate(d,portal,false);
 quickNotify.onclick=()=>quickUpdate(d,portal,true);
 saveAssets.onclick=async()=>{try{await updateDoc(doc(db,'businessDiscoveries',d.id),{prototypeUrl:prototypeUrl.value.trim(),quotationUrl:quotationUrl.value.trim(),blueprintUrl:blueprintUrl.value.trim(),liveSystemUrl:liveSystemUrl.value.trim(),updatedAt:serverTimestamp()});show('assetMessage','Saved.','success')}catch(e){show('assetMessage',e.message,'error')}};
 saveTasks.onclick=async()=>{const updated=[...tasks];detailView.querySelectorAll('[data-task-text]').forEach(el=>{const i=Number(el.dataset.taskText);updated[i]={...(updated[i]||{}),text:el.value,done:detailView.querySelector(`[data-task-check="${i}"]`).checked}});if(newTaskText.value.trim())updated.push({text:newTaskText.value.trim(),owner:newTaskOwner.value.trim(),done:false,createdAt:new Date().toISOString()});await updateDoc(doc(db,'businessDiscoveries',d.id),{tasks:updated,updatedAt:serverTimestamp()})};
}

async function quickUpdate(d,portal,notify){
 try{
  const stage=quickStage.value,progress=Number(quickProgress.value),message=quickMessage.value.trim();
  await updateDoc(doc(db,'businessDiscoveries',d.id),{
    stage,progress,customerMessage:message,status:d.status==='new'?'active':d.status,
    updatedAt:serverTimestamp(),
    timeline:arrayUnion({stage,title:`${stage} update`,message,at:new Date().toISOString()})
  });
  show('quickMessageBox','Update saved.','success');
  if(notify){
    const phone=String(d.phone||'').replace(/\D/g,'');
    const text=`Hi ${d.ownerName||''}, update daripada BinaLab untuk ${d.businessName}:\\n\\n${stage} — ${progress}%\\n${message}\\n\\nPortal: ${portal.href}`;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank');
  }
 }catch(e){show('quickMessageBox',e.message,'error')}
}
function show(id,text,type){const el=document.getElementById(id);el.textContent=text;el.className=`message ${type} show`}

function listenContent(){
 onSnapshot(query(collection(db,'websiteSystems'),orderBy('sortOrder','asc')),snap=>{websiteSystems=snap.docs.map(x=>({id:x.id,...x.data()}));renderSystemList()});
 onSnapshot(query(collection(db,'websiteTestimonials'),orderBy('sortOrder','asc')),snap=>{websiteTestimonials=snap.docs.map(x=>({id:x.id,...x.data()}));renderTestimonialList()});
}
function renderSystemList(){systemList.innerHTML=websiteSystems.map(d=>`<div class="content-item ${d.id===selectedSystemId?'active':''}" data-id="${d.id}"><h3>${esc(d.name||'Untitled')}</h3><p>${esc(d.industry||'')} • ${d.published===false?'Draft':'Published'} • Order ${d.sortOrder||0}</p></div>`).join('')||'<div class="empty">No systems yet.</div>';systemList.querySelectorAll('.content-item').forEach(el=>el.onclick=()=>{selectedSystemId=el.dataset.id;renderSystemList();renderSystemEditor(websiteSystems.find(x=>x.id===selectedSystemId))})}
function renderSystemEditor(d={}){
 systemImageData=d.coverData||null;systemEditor.innerHTML=`<h2>${d.id?'Edit':'New'} System</h2><div class="grid2"><div class="field"><label>Name</label><input id="sysName" value="${esc(d.name||'')}"></div><div class="field"><label>Industry</label><input id="sysIndustry" value="${esc(d.industry||'')}"></div><div class="field full"><label>Description BM</label><textarea id="sysMs">${esc(d.descriptionMs||'')}</textarea></div><div class="field full"><label>Description English</label><textarea id="sysEn">${esc(d.descriptionEn||'')}</textarea></div><div class="field full"><label>Live URL</label><input id="sysUrl" value="${esc(d.liveUrl||'')}"></div><div class="field"><label>Tags</label><input id="sysTags" value="${esc((d.tags||[]).join(', '))}"></div><div class="field"><label>Sort Order</label><input id="sysOrder" type="number" value="${Number(d.sortOrder||websiteSystems.length+1)}"></div><div class="field full"><label>Cover Screenshot</label><input id="sysImage" type="file" accept="image/*">${d.coverData?`<img class="thumb" style="margin-top:10px" src="${d.coverData}">`:''}</div></div><label class="toggle"><input id="sysPublished" type="checkbox" ${d.published===false?'':'checked'}> Publish on website</label><div class="actions"><button class="btn primary" id="saveSystem">Save</button>${d.id?'<button class="btn danger" id="deleteSystem">Delete</button>':''}</div><div class="message" id="systemMessage"></div>`;
 sysImage.onchange=async()=>{if(sysImage.files[0])systemImageData=await compressImage(sysImage.files[0],340*1024,900)};
 saveSystem.onclick=async()=>{try{const p={name:sysName.value.trim(),industry:sysIndustry.value.trim(),descriptionMs:sysMs.value.trim(),descriptionEn:sysEn.value.trim(),liveUrl:sysUrl.value.trim(),tags:sysTags.value.split(',').map(x=>x.trim()).filter(Boolean),sortOrder:Number(sysOrder.value||999),published:sysPublished.checked,coverData:systemImageData||'',updatedAt:serverTimestamp()};if(!p.name)throw new Error('System name required.');if(d.id)await updateDoc(doc(db,'websiteSystems',d.id),p);else{const r=await addDoc(collection(db,'websiteSystems'),{...p,createdAt:serverTimestamp()});selectedSystemId=r.id}show('systemMessage','Saved. Website updates automatically.','success')}catch(e){show('systemMessage',e.message,'error')}};
 if(d.id)deleteSystem.onclick=async()=>{if(confirm('Delete this system?'))await deleteDoc(doc(db,'websiteSystems',d.id))};
}
newSystem.onclick=()=>renderSystemEditor({});
const defaults=[{id:'abedin-auto',name:'Abedin Auto',industry:'Automotive',descriptionMs:'Digital rental workflow, vehicle inventory dan operational mission control.',descriptionEn:'Digital rental workflow, vehicle inventory and operational mission control.',liveUrl:'https://danialrohaizat012-sys.github.io/AbeDInAuto/',coverData:'abedin-auto.jpg',tags:['Automotive','PWA','Live'],sortOrder:1,published:true},{id:'awanzco',name:'Awanzco',industry:'Retail',descriptionMs:'Deal sourcing dan inventory intelligence untuk perniagaan used-device.',descriptionEn:'Deal sourcing and inventory intelligence for a used-device business.',liveUrl:'https://danialrohaizat012-sys.github.io/Awanzco/',coverData:'awanzco.jpg',tags:['Retail','Inventory','Live'],sortOrder:2,published:true},{id:'keduaos',name:'KeduaOS',industry:'F&B',descriptionMs:'Booking, event dan customer operations untuk perniagaan mobile coffee van.',descriptionEn:'Booking, events and customer operations for a mobile coffee van business.',liveUrl:'https://danialrohaizat012-sys.github.io/KeduaKopi/',coverData:'keduaos.jpg',tags:['F&B','Booking','Live'],sortOrder:3,published:true},{id:'mos-karting',name:'MOS Karting',industry:'Entertainment',descriptionMs:'Booking dan customer experience untuk operasi go-kart dengan sesi 10 minit.',descriptionEn:'Booking and customer experience for a go-kart operation with 10-minute sessions.',liveUrl:'https://danialrohaizat012-sys.github.io/MosKart/',coverData:'mos-karting.jpg',tags:['Entertainment','Booking','Live'],sortOrder:4,published:true}];
seedSystems.onclick=async()=>{for(const d of defaults)await setDoc(doc(db,'websiteSystems',d.id),{...d,updatedAt:serverTimestamp()},{merge:true});alert('Current 4 imported.')};

function renderTestimonialList(){testimonialList.innerHTML=websiteTestimonials.map(d=>`<div class="content-item ${d.id===selectedTestimonialId?'active':''}" data-id="${d.id}"><h3>${esc(d.clientName||'Client')}</h3><p>${esc(d.businessName||'')} • ${d.published===false?'Draft':'Published'}</p></div>`).join('')||'<div class="empty">No testimonials yet.</div>';testimonialList.querySelectorAll('.content-item').forEach(el=>el.onclick=()=>{selectedTestimonialId=el.dataset.id;renderTestimonialList();renderTestimonialEditor(websiteTestimonials.find(x=>x.id===selectedTestimonialId))})}
function renderTestimonialEditor(d={}){
 testimonialAvatarData=d.avatarData||null;testimonialEditor.innerHTML=`<h2>${d.id?'Edit':'New'} Testimonial</h2><div class="grid2"><div class="field"><label>Client Name</label><input id="tName" value="${esc(d.clientName||'')}"></div><div class="field"><label>Business</label><input id="tBusiness" value="${esc(d.businessName||'')}"></div><div class="field"><label>Role</label><input id="tRole" value="${esc(d.role||'')}"></div><div class="field"><label>Sort Order</label><input id="tOrder" type="number" value="${Number(d.sortOrder||websiteTestimonials.length+1)}"></div><div class="field full"><label>Testimonial BM</label><textarea id="tMs">${esc(d.quoteMs||'')}</textarea></div><div class="field full"><label>Testimonial English</label><textarea id="tEn">${esc(d.quoteEn||'')}</textarea></div><div class="field full"><label>Photo</label><input id="tAvatar" type="file" accept="image/*">${d.avatarData?`<img class="thumb" style="margin-top:10px" src="${d.avatarData}">`:''}</div></div><label class="toggle"><input id="tPublished" type="checkbox" ${d.published===false?'':'checked'}> Publish on website</label><div class="actions"><button class="btn primary" id="saveTestimonial">Save</button>${d.id?'<button class="btn danger" id="deleteTestimonial">Delete</button>':''}</div><div class="message" id="testimonialMessage"></div>`;
 tAvatar.onchange=async()=>{if(tAvatar.files[0])testimonialAvatarData=await compressImage(tAvatar.files[0],120*1024,400)};
 saveTestimonial.onclick=async()=>{try{const p={clientName:tName.value.trim(),businessName:tBusiness.value.trim(),role:tRole.value.trim(),quoteMs:tMs.value.trim(),quoteEn:tEn.value.trim(),sortOrder:Number(tOrder.value||999),published:tPublished.checked,avatarData:testimonialAvatarData||'',updatedAt:serverTimestamp()};if(!p.clientName||(!p.quoteMs&&!p.quoteEn))throw new Error('Client name and testimonial required.');if(d.id)await updateDoc(doc(db,'websiteTestimonials',d.id),p);else{const r=await addDoc(collection(db,'websiteTestimonials'),{...p,createdAt:serverTimestamp()});selectedTestimonialId=r.id}show('testimonialMessage','Saved. Website updates automatically.','success')}catch(e){show('testimonialMessage',e.message,'error')}};
 if(d.id)deleteTestimonial.onclick=async()=>{if(confirm('Delete testimonial?'))await deleteDoc(doc(db,'websiteTestimonials',d.id))};
}
newTestimonial.onclick=()=>renderTestimonialEditor({});

async function compressImage(file,maxBytes,maxDimension){let bmp=await createImageBitmap(file),dim=maxDimension,best=null;while(dim>=160){const scale=Math.min(1,dim/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);for(let q=.86;q>=.3;q-=.08){const blob=await new Promise(r=>c.toBlob(r,'image/webp',q));if(blob&&(!best||blob.size<best.size))best=blob;if(blob&&blob.size<=maxBytes){const data=await toData(blob);bmp.close?.();return data}}dim=Math.floor(dim*.8)}if(best){const data=await toData(best);bmp.close?.();return data}throw new Error('Compression failed')}
function toData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script>
</body></html>
