<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071425">
  <title>BinaLab Studio</title>
  <style>
    :root{--deep:#061321;--navy:#0D1B2A;--green:#22C55E;--muted:#6B7788;--line:#E5EBF1;--soft:#F4F7FA}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#F6F8FB;color:#111827}
    button,input,select,textarea{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#071425,#0D2743)}
    .login-card{width:min(430px,100%);background:#fff;border-radius:28px;padding:30px}.brand{display:flex;align-items:center;gap:11px;font-weight:950;font-size:21px}.brand img{width:44px;border-radius:14px}.brand b{color:var(--green)}
    .field{display:grid;gap:7px;margin-top:14px}.field label{font-size:12px;font-weight:900;color:#475467}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;outline:none}
    .btn{border:0;border-radius:14px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--green),#14B8A6);color:#fff}.dark{background:var(--navy);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}
    .app{display:none}.top{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 20px}
    .top-inner{max-width:1380px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}.shell{max-width:1380px;margin:auto;padding:22px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px}.stat strong{font-size:30px;display:block}.stat small{color:var(--muted)}
    .layout{display:grid;grid-template-columns:380px 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden}.panel-head{padding:18px;border-bottom:1px solid var(--line)}
    .lead-list{max-height:700px;overflow:auto}.lead{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}.lead:hover,.lead.active{background:#F0FDF4}.lead h3{margin:0 0 5px;font-size:16px}.lead p{margin:0;color:var(--muted);font-size:12px}.detail{padding:22px}.empty{text-align:center;color:var(--muted);padding:80px 20px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.message{margin-top:15px;padding:13px;border-radius:14px;display:none}.message.show{display:block}.success{background:#F0FDF4;color:#166534}.error{background:#FFF1F2;color:#BE123C}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.logo{width:76px;height:76px;border-radius:18px;object-fit:cover;background:var(--soft)}
    @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.lead-list{max-height:360px}}
    @media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.shell{padding:14px}.detail-grid{grid-template-columns:1fr}.full{grid-column:auto}}
  </style>
</head>
<body>
  <section class="login" id="loginView">
    <div class="login-card">
      <div class="brand"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b> Studio</span></div>
      <h1>Owner Login</h1>
      <p style="color:var(--muted)">Manage discoveries, progress, prototypes and customer updates.</p>
      <div class="field"><label>Email</label><input id="loginEmail" type="email"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password"></div>
      <button class="btn primary" id="loginBtn" style="width:100%;margin-top:16px">Login to Studio</button>
      <div class="message error" id="loginError"></div>
    </div>
  </section>
  <div class="app" id="appView">
    <header class="top"><div class="top-inner"><div class="brand"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b> Studio</span></div><button class="btn ghost" id="logoutBtn">Logout</button></div></header>
    <main class="shell">
      <div class="stats">
        <div class="stat"><strong id="statTotal">0</strong><small>Total Discoveries</small></div>
        <div class="stat"><strong id="statNew">0</strong><small>New Leads</small></div>
        <div class="stat"><strong id="statPrototype">0</strong><small>Prototype Stage</small></div>
        <div class="stat"><strong id="statActive">0</strong><small>Active Projects</small></div>
      </div>
      <div class="layout">
        <section class="panel">
          <div class="panel-head"><strong>Business Discoveries</strong></div>
          <div class="lead-list" id="leadList"></div>
        </section>
        <section class="panel">
          <div class="detail" id="detailView"><div class="empty">Select a discovery to manage it.</div></div>
        </section>
      </div>
    </main>
  </div>
  <script type="module">
    import {db,auth,collection,query,orderBy,onSnapshot,doc,updateDoc,serverTimestamp,arrayUnion,signInWithEmailAndPassword,signOut,onAuthStateChanged} from './firebase-config.js?v=200';
    const stages=['Discovery','Problem Mapping','Blueprint','Prototype','Proposal','Development','Testing','Launch'];
    let discoveries=[],selectedId=null;

    const loginView=document.getElementById('loginView'),appView=document.getElementById('appView');
    onAuthStateChanged(auth,user=>{loginView.style.display=user?'none':'grid';appView.style.display=user?'block':'none';if(user)startListening()});
    document.getElementById('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value)}catch(e){loginError.textContent=e.message;loginError.className='message error show'}};
    document.getElementById('logoutBtn').onclick=()=>signOut(auth);

    function startListening(){
      onSnapshot(query(collection(db,'businessDiscoveries'),orderBy('createdAt','desc')),snap=>{
        discoveries=snap.docs.map(x=>({id:x.id,...x.data()})); renderList(); renderStats(); if(selectedId)renderDetail(discoveries.find(x=>x.id===selectedId));
      });
    }
    function renderStats(){
      statTotal.textContent=discoveries.length;
      statNew.textContent=discoveries.filter(x=>x.status==='new').length;
      statPrototype.textContent=discoveries.filter(x=>x.stage==='Prototype').length;
      statActive.textContent=discoveries.filter(x=>!['completed','rejected'].includes(x.status)).length;
    }
    function renderList(){
      leadList.innerHTML=discoveries.map(d=>`<div class="lead ${d.id===selectedId?'active':''}" data-id="${d.id}"><h3>${esc(d.businessName||'Untitled')}</h3><p>${esc(d.caseId||'')} • ${esc(d.stage||'Discovery')} • ${esc(d.ownerName||'')} • ${esc(d.phone||'')}</p></div>`).join('')||'<div class="empty">No discoveries yet.</div>';
      leadList.querySelectorAll('.lead').forEach(el=>el.onclick=()=>{selectedId=el.dataset.id;renderList();renderDetail(discoveries.find(x=>x.id===selectedId))});
    }
    function renderDetail(d){
      if(!d){detailView.innerHTML='<div class="empty">Select a discovery.</div>';return}
      const portal=new URL('portal.html',location.href);portal.searchParams.set('id',d.id);
      detailView.innerHTML=`
        <div style="display:flex;justify-content:space-between;gap:16px;align-items:start">
          <div><small style="color:var(--green);font-weight:900">${esc(d.caseId||'DISCOVERY')}</small><h1 style="margin:8px 0">${esc(d.businessName||'Untitled')}</h1><p style="color:var(--muted)">${esc(d.industry||'')} • ${esc(d.ownerName||'')} • ${esc(d.phone||'')}</p></div>
          ${d.logoData?`<img class="logo" src="${d.logoData}">`:''}
        </div>
        <div class="detail-grid">
          <div class="field"><label>Stage</label><select id="editStage">${stages.map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select></div>
          <div class="field"><label>Progress %</label><input id="editProgress" type="number" min="0" max="100" value="${Number(d.progress||10)}"></div>
          <div class="field full"><label>Customer Update Message</label><textarea id="editMessage">${esc(d.customerMessage||'')}</textarea></div>
          <div class="field full"><label>Prototype URL</label><input id="editPrototype" value="${esc(d.prototypeUrl||'')}" placeholder="https://..."></div>
          <div class="field"><label>Status</label><select id="editStatus"><option value="new" ${d.status==='new'?'selected':''}>New</option><option value="active" ${d.status==='active'?'selected':''}>Active</option><option value="completed" ${d.status==='completed'?'selected':''}>Completed</option><option value="rejected" ${d.status==='rejected'?'selected':''}>Rejected</option></select></div>
          <div class="field"><label>Portal Link</label><input id="portalField" readonly value="${portal.href}"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="saveUpdate">Save Progress</button>
          <button class="btn dark" id="notifyCustomer">Update & Notify WhatsApp</button>
          <button class="btn ghost" id="copyPortal">Copy Portal Link</button>
          <a class="btn ghost" href="${portal.href}" target="_blank">Open Customer Portal</a>
        </div>
        <div class="message" id="detailMessage"></div>
        <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
        <h2>Discovery Brief</h2>
        <p><strong>Operation:</strong><br>${esc(d.dailyOperation||'—')}</p>
        <p><strong>Biggest Problem:</strong><br>${esc(d.biggestProblem||'—')}</p>
        <p><strong>Dream Outcome:</strong><br>${esc(d.dreamOutcome||'—')}</p>`;
      document.getElementById('saveUpdate').onclick=()=>save(false);
      document.getElementById('notifyCustomer').onclick=()=>save(true);
      document.getElementById('copyPortal').onclick=async()=>{await navigator.clipboard.writeText(portal.href);show('Portal link copied.','success')};
      async function save(notify){
        const stage=editStage.value,progress=Number(editProgress.value),message=editMessage.value.trim(),prototypeUrl=editPrototype.value.trim(),status=editStatus.value;
        try{
          await updateDoc(doc(db,'businessDiscoveries',d.id),{
            stage,progress,customerMessage:message,prototypeUrl,status,updatedAt:serverTimestamp(),
            timeline:arrayUnion({stage,title:`${stage} update`,message,at:new Date().toISOString()})
          });
          show('Progress updated successfully.','success');
          if(notify){
            const phone=String(d.phone||'').replace(/\D/g,'');
            const text=`Hi ${d.ownerName||''}, update daripada BinaLab untuk ${d.businessName}:\\n\\n${stage} — ${progress}%\\n${message}\\n\\nLihat status di sini: ${portal.href}`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank');
          }
        }catch(e){show(e.message,'error')}
      }
      function show(text,type){const el=document.getElementById('detailMessage');el.textContent=text;el.className=`message ${type} show`}
    }
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
  </script>
</body>
</html>
