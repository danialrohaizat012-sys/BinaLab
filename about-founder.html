<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071425">
<title>Behind Us — BinaLab</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--navy:#071425;--navy2:#0D2743;--green:#22C55E;--blue:#2563EB;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--soft:#F7F9FC;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,Inter,system-ui,-apple-system,sans-serif;background:#fff;color:var(--ink)}a{text-decoration:none;color:inherit}.container{width:min(1120px,calc(100% - 28px));margin:auto}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav-inner{display:flex;justify-content:space-between;align-items:center;padding:13px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:950;font-size:20px}.brand img{width:40px;height:40px;border-radius:12px}.brand b{color:var(--green)}.back{padding:10px 13px;border:1px solid var(--line);border-radius:12px;font-weight:850}
.hero{padding:68px 0;background:radial-gradient(circle at 10% 10%,rgba(34,197,94,.12),transparent 28%),linear-gradient(180deg,#fff,#F8FAFC)}.hero-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:48px;align-items:center}.photo-wrap{background:linear-gradient(145deg,#071425,#0D2743);border-radius:34px;padding:20px;box-shadow:0 24px 70px rgba(15,23,42,.14)}.photo-wrap img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:25px;background:#0D2743}.eyebrow{display:inline-block;padding:8px 11px;border-radius:999px;background:#EEFDF3;color:#166534;font-size:11px;font-weight:950;letter-spacing:.09em}.hero h1{font-size:clamp(44px,7vw,72px);line-height:.95;letter-spacing:-3.5px;margin:16px 0}.hero h1 span{color:var(--green)}.hero p{font-size:17px;line-height:1.8;color:#475569}.role{font-weight:900;color:#334155;margin-top:8px}
.socials{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.social{display:inline-flex;align-items:center;gap:8px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:850;font-size:12px}.social:hover{border-color:var(--green);background:#F0FDF4}
.social .ico{width:26px;height:26px;border-radius:8px;background:#071425;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:950}
section{padding:64px 0}.story-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:26px;border:1px solid var(--line);border-radius:24px;background:#fff}.card h2{font-size:30px;margin:0 0 12px}.card p{color:var(--muted);line-height:1.8}.quote{background:linear-gradient(145deg,#071425,#0D2743);color:#fff}.quote p{color:#B9C6D3;font-size:18px}.values{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.value{padding:20px;border-radius:20px;background:#F8FAFC;border:1px solid var(--line)}.value strong{display:block;margin-bottom:7px}.value p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
footer{padding:30px 0;background:#061321;color:#fff}.foot{display:flex;justify-content:space-between;align-items:center;gap:15px}.foot small{color:#8FA1B4}
.empty{padding:120px 20px;text-align:center;color:var(--muted)}
@media(max-width:820px){.hero-grid,.story-grid{grid-template-columns:1fr}.values{grid-template-columns:1fr}.hero{padding-top:46px}.photo-wrap{max-width:430px}.foot{flex-direction:column;align-items:flex-start}}
html,body{max-width:100%;overflow-x:hidden}
img,video,svg,canvas{max-width:100%}
input,select,textarea,button{max-width:100%}
@media(max-width:768px){
  body{font-size:15px}
  .container{width:min(100% - 24px,1120px)}
  .nav-inner{gap:10px}
  .nav-links{max-width:100%;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .hero-grid,.grid2,.story-grid,.paper-meta,.paper-summary{grid-template-columns:1fr!important}
  .hero h1{font-size:clamp(38px,12vw,56px)!important;letter-spacing:-2px!important}
  .hero p{font-size:15px!important}
  .actions,.quick-actions,.preview-toolbar,.panel-head{flex-wrap:wrap}
  .actions .btn,.quick-actions .btn{min-height:44px}
  .card,.panel,.form-card{max-width:100%;overflow:hidden}
  table{font-size:12px}
  .table-wrap,.paper-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .paper{width:100%!important;min-height:auto!important;border-radius:14px!important}
  .paper-inner{padding:22px 15px!important}
  .paper-head{display:grid!important;grid-template-columns:1fr!important;gap:16px!important}
  .paper-doc{text-align:left!important}
  .paper-brand img{width:52px!important;height:52px!important}
  .paper-doc h1{font-size:27px!important}
  .paper-summary{gap:14px!important}
  .paper-totals{width:100%!important}
  .preview-shell{padding:8px!important}
  .modal,.dialog,.modal-card{width:calc(100vw - 24px)!important;max-width:calc(100vw - 24px)!important;max-height:88vh;overflow-y:auto}
  textarea{min-height:110px}
  input,select,textarea{font-size:16px!important}
}
@media(max-width:480px){
  .container{width:min(100% - 18px,1120px)}
  section{padding-left:0;padding-right:0}
  .brand{font-size:17px}
  .brand img{width:36px;height:36px}
  .btn{padding:11px 12px}
  .hero{padding-top:38px}
  .socials{gap:8px}
  .social{flex:1 1 calc(50% - 8px);justify-content:center}
  .values{grid-template-columns:1fr!important}
}

/* BinaLab Floating WhatsApp */
.binalab-whatsapp{position:fixed;right:24px;bottom:24px;z-index:90;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;background:#22C55E;color:#fff;font-weight:900;font-size:13px;box-shadow:0 14px 38px rgba(15,23,42,.24);transition:transform .2s ease,box-shadow .2s ease}
.binalab-whatsapp:hover{transform:translateY(-3px);box-shadow:0 18px 44px rgba(15,23,42,.3)}
.binalab-whatsapp svg{width:26px;height:26px;flex:0 0 auto}
@media(max-width:640px){.binalab-whatsapp{right:16px;bottom:16px;width:56px;height:56px;padding:0;justify-content:center}.binalab-whatsapp span{display:none}.binalab-whatsapp svg{width:30px;height:30px}}
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b></span></a><a class="back" href="index.html">← Kembali</a></div></header>
<main id="mainContent" hidden>
<section class="hero"><div class="container hero-grid">
<div class="photo-wrap"><img id="founderPhoto" src="icon-512.png" alt="Founder BinaLab"></div>
<div><span class="eyebrow">BEHIND US</span><h1 id="founderName">Founder <span>BinaLab</span></h1><div class="role" id="founderRole"></div><p id="founderIntro"></p><div class="socials" id="socialLinks"></div></div>
</div></section>

<section><div class="container story-grid">
<article class="card"><h2>Kisah Saya</h2><p id="founderStory"></p></article>
<article class="card quote"><h2>Kenapa BinaLab?</h2><p id="founderWhy"></p></article>
</div></section>

<section><div class="container"><div class="values" id="founderValues"></div></div></section>
</main>
<div class="empty" id="loading">Loading founder profile...</div>
<footer><div class="container foot"><div class="brand"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b></span></div><small>Real Business. Real Solutions.</small></div></footer>

<script type="module">
import {db,doc,onSnapshot} from './firebase-config.js?v=457';
const icons={facebook:'f',tiktok:'♪',instagram:'◎',threads:'@',youtube:'▶',linkedin:'in'};
onSnapshot(doc(db,'siteContent','founder'),snap=>{
  loading.hidden=true; mainContent.hidden=false;
  const d=snap.exists()?snap.data():{};
  founderName.innerHTML=esc(d.name||'Danial Rohaizat').replace(/BinaLab/g,'<span>BinaLab</span>');
  founderRole.textContent=d.roleMs||'Founder, BinaLab';
  founderIntro.textContent=d.introMs||'Membina sistem yang membantu perniagaan mikro dan SME bergerak daripada proses manual kepada operasi digital yang lebih mudah.';
  founderStory.textContent=d.storyMs||'Profil founder sedang dikemaskini.';
  founderWhy.textContent=d.whyMs||'BinaLab dibina untuk menyelesaikan masalah sebenar bisnes dengan sistem yang praktikal dan mudah digunakan.';
  founderPhoto.src=d.photoData||'icon-512.png';
  const values=(d.valuesMs||['Fahami masalah sebenar','Reka sistem yang mudah digunakan','Bina untuk operasi dunia sebenar']);
  founderValues.innerHTML=values.map((v,i)=>`<div class="value"><strong>${String(i+1).padStart(2,'0')}</strong><p>${esc(v)}</p></div>`).join('');
  const socials=d.socials||{};
  socialLinks.innerHTML=Object.entries(socials).filter(([k,v])=>v).map(([k,v])=>`<a class="social" href="${esc(v)}" target="_blank" rel="noopener"><span class="ico">${icons[k]||'↗'}</span>${label(k)}</a>`).join('');
});
function label(k){return ({facebook:'Facebook',tiktok:'TikTok',instagram:'Instagram',threads:'Threads',youtube:'YouTube',linkedin:'LinkedIn'})[k]||k}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script>
