<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071425">
  <title>BinaLab Client Portal</title>
  <style>
    :root{--deep:#061321;--navy:#0D1B2A;--green:#22C55E;--muted:#6B7788;--line:#E5EBF1;--soft:#F4F7FA}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#F6F8FB;color:#111827}
    .shell{max-width:980px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:950;font-size:20px}.brand img{width:42px;border-radius:13px}.brand b{color:var(--green)}
    .badge{padding:8px 11px;border-radius:999px;background:#EAFBF0;color:#166534;font-size:12px;font-weight:900}
    .hero{background:linear-gradient(145deg,#071425,#0D2743);color:#fff;border-radius:28px;padding:32px;position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-120px;bottom:-150px;background:radial-gradient(circle,rgba(34,197,94,.38),transparent 68%)}
    .hero small{color:#9FB0C3;font-weight:900;letter-spacing:.12em}.hero h1{font-size:clamp(38px,7vw,68px);line-height:.95;letter-spacing:-3px;margin:14px 0}
    .hero p{color:#B7C4D1;line-height:1.7;max-width:680px}.progress{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-top:24px}
    .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#14B8A6);width:0;transition:width .6s ease}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}
    .card h2{margin:0 0 16px;font-size:23px}.timeline{display:grid;gap:12px}.item{display:grid;grid-template-columns:34px 1fr;gap:12px}
    .dot{width:30px;height:30px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted)}
    .item.done .dot{background:#DCFCE7;color:#15803D}.item.current .dot{background:#DBEAFE;color:#1D4ED8}.item h3{margin:2px 0 5px;font-size:15px}.item p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    .info{display:grid;gap:11px}.info div{padding:13px;border-radius:14px;background:var(--soft)}.info small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
    .prototype{display:none;margin-top:18px;padding:20px;border-radius:20px;background:#F0FDF4;border:1px solid #D8F4E1}.prototype.show{display:block}
    .btn{display:inline-flex;justify-content:center;padding:13px 17px;border-radius:14px;text-decoration:none;font-weight:900;border:0;cursor:pointer}
    .primary{background:linear-gradient(135deg,var(--green),#14B8A6);color:#fff}.empty{text-align:center;padding:80px 20px;color:var(--muted)}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.shell{padding:14px}.hero{padding:26px 20px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand"><img src="icon-192.png" alt=""><span>Bina<b>Lab</b> Portal</span></div>
      <span class="badge" id="statusBadge">Loading...</span>
    </div>
    <main id="content" hidden>
      <section class="hero">
        <small>CUSTOMER PROJECT PORTAL</small>
        <h1 id="businessName">Your Project</h1>
        <p id="customerMessage">Loading current project update...</p><p style="margin-top:10px"><strong id="caseIdLabel"></strong></p>
        <div class="progress"><span id="progressBar"></span></div>
        <p><strong id="progressText">0%</strong> complete • <span id="currentStage">Discovery</span></p>
      </section>
      <div class="grid">
        <section class="card">
          <h2>Project Journey</h2>
          <div class="timeline" id="timeline"></div>
          <div class="prototype" id="prototypeBox">
            <h2 style="margin-top:0">Prototype Ready</h2>
            <p style="color:var(--muted)">Your prototype is ready to review.</p>
            <a class="btn primary" id="prototypeLink" target="_blank" rel="noopener">Open Prototype →</a>
          </div>
        </section>
        <aside class="card">
          <h2>Project Details</h2>
          <div class="info">
            <div><small>Business</small><strong id="detailBusiness"></strong></div>
            <div><small>Current Stage</small><strong id="detailStage"></strong></div>
            <div><small>Last Updated</small><strong id="detailUpdated"></strong></div>
            <div><small>Contact</small><strong id="detailContact"></strong></div>
          </div>
        </aside>
      </div>
    </main>
    <div class="empty" id="empty">Loading your project...</div>
  </div>
  <script type="module">
    import {db,doc,onSnapshot} from './firebase-config.js?v=220';
    const id = new URLSearchParams(location.search).get('id');
    const stages = ['Discovery','Problem Mapping','Blueprint','Prototype','Proposal','Development','Testing','Launch'];
    const empty = document.getElementById('empty');
    if(!id){empty.textContent='Portal link tidak lengkap.'}
    else{
      onSnapshot(doc(db,'businessDiscoveries',id), snap=>{
        if(!snap.exists()){empty.textContent='Project tidak dijumpai.';return}
        const d=snap.data(); empty.hidden=true; document.getElementById('content').hidden=false;
        const progress=Number(d.progress||10);
        document.getElementById('businessName').textContent=d.businessName||'Your Project';document.getElementById('caseIdLabel').textContent=d.caseId||'';
        document.getElementById('customerMessage').textContent=d.customerMessage||'BinaLab is reviewing your project.';
        document.getElementById('progressBar').style.width=progress+'%';
        document.getElementById('progressText').textContent=progress+'%';
        document.getElementById('currentStage').textContent=d.stage||'Discovery';
        document.getElementById('statusBadge').textContent=d.status==='completed'?'Completed':'In Progress';
        document.getElementById('detailBusiness').textContent=d.businessName||'—';
        document.getElementById('detailStage').textContent=d.stage||'Discovery';
        const updated=d.updatedAt?.toDate?d.updatedAt.toDate():new Date(d.submittedAt||Date.now());
        document.getElementById('detailUpdated').textContent=updated.toLocaleString();
        document.getElementById('detailContact').textContent=[d.ownerName,d.phone].filter(Boolean).join(' • ')||'—';
        const currentIndex=Math.max(0,stages.indexOf(d.stage));
        document.getElementById('timeline').innerHTML=stages.map((stage,i)=>{
          const cls=i<currentIndex?'done':i===currentIndex?'current':'';
          const symbol=i<currentIndex?'✓':i+1;
          const event=(d.timeline||[]).slice().reverse().find(x=>x.stage===stage);
          return `<div class="item ${cls}"><div class="dot">${symbol}</div><div><h3>${stage}</h3><p>${event?.message|| (i===currentIndex?d.customerMessage:'Waiting for previous stage')}</p></div></div>`;
        }).join('');
        if(d.prototypeUrl){
          document.getElementById('prototypeBox').classList.add('show');
          document.getElementById('prototypeLink').href=d.prototypeUrl;
        }
      },err=>{empty.textContent='Tidak dapat memuatkan portal. '+err.message});
    }
  </script>
</body>
</html>
